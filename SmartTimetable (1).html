<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>SmartTimetable</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #f3f8fe;
            --s: #e9f1fb;
            --w: #fff;
            --pt: #fff;
            --tx: #1b2733;
            --mu: #5f7084;
            --bd: #d6e4f4;
            --ac: #2f6db5;
            --ac2: #dce9f8;
            --ok: #2f6b3f;
            --er: #a63d3d;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme=light]) {
                --bg: #141516;
                --s: #1c1d1f;
                --w: #1c1d1f;
                --pt: #141516;
                --tx: #ececea;
                --mu: #9a9a94;
                --bd: #2c2d30;
                --ac: #8fb0dc;
                --ac2: #1f2a3a;
                --ok: #7bc08c;
                --er: #e08a8a;
                color-scheme: dark
            }
        }

        :root[data-theme=dark] {
            --bg: #141516;
            --s: #1c1d1f;
            --w: #1c1d1f;
            --pt: #141516;
            --tx: #ececea;
            --mu: #9a9a94;
            --bd: #2c2d30;
            --ac: #8fb0dc;
            --ac2: #1f2a3a;
            --ok: #7bc08c;
            --er: #e08a8a;
            color-scheme: dark
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 14px/1.6 Inter, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            width: 100%
        }

        em,
        .it {
            font-style: italic;
            color: var(--mu)
        }

        .app {
            display: flex;
            min-height: 100vh;
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            background: var(--bg);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.05)
        }

        nav {
            display: flex;
            flex-direction: column;
            width: 260px;
            flex: none;
            border-right: 1px solid var(--bd);
            background: var(--s);
            padding: 20px 14px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow: auto
        }

        nav h1 {
            font-size: 16px;
            font-weight: 600;
            margin: 0 8px 2px;
            letter-spacing: -.01em
        }

        nav .it {
            display: block;
            margin: 0 8px 16px;
            font-size: 12px
        }

        nav h6 {
            margin: 16px 8px 4px;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--mu)
        }

        .nf {
            margin-top: auto;
            position: sticky;
            bottom: 0;
            background: var(--s);
            padding-top: 12px;
            border-top: 1px solid var(--bd)
        }

        nav a {
            display: block;
            padding: 6px 10px;
            border-radius: 6px;
            color: var(--tx);
            text-decoration: none;
            font-size: 13px
        }

        nav a:hover {
            background: var(--ac2)
        }

        nav a.on {
            background: var(--ac2);
            color: var(--ac);
            font-weight: 500
        }

        main {
            flex: 1;
            min-width: 0;
            padding: 36px 48px;
            max-width: 1180px;
            margin: 0 auto;
            width: 100%
        }

        h2 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -.02em;
            margin: 0
        }

        .lead {
            margin: 2px 0 24px;
            font-style: italic;
            color: var(--mu)
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 24px
        }

        .card {
            background: var(--w);
            border: 1px solid var(--bd);
            border-radius: 8px;
            padding: 14px 16px
        }

        .card b {
            display: block;
            font-size: 26px;
            font-weight: 600
        }

        .card span {
            font-style: italic;
            color: var(--mu);
            font-size: 12px
        }

        .wrap {
            overflow-x: auto;
            background: var(--w);
            border: 1px solid var(--bd);
            border-radius: 8px;
            margin-bottom: 16px
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px
        }

        th,
        td {
            padding: 9px 12px;
            text-align: left;
            border-bottom: 1px solid var(--bd);
            white-space: nowrap
        }

        th {
            font-weight: 500;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--mu);
            background: var(--s)
        }

        tr:last-child td {
            border-bottom: 0
        }

        td.c {
            font-style: italic;
            color: var(--mu)
        }

        button,
        select,
        input,
        textarea {
            font: inherit;
            color: var(--tx);
            background: var(--w);
            border: 1px solid var(--bd);
            border-radius: 6px;
            padding: 6px 10px
        }

        button {
            cursor: pointer
        }

        button.p {
            background: var(--ac);
            color: var(--pt);
            border-color: var(--ac)
        }

        button:hover {
            opacity: .9;
            border-color: var(--ac)
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid var(--ac2);
            border-color: var(--ac)
        }

        button.x {
            border: 0;
            color: var(--er);
            padding: 2px 6px
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            align-items: center
        }

        .tag {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 12px;
            background: var(--ac2);
            color: var(--ac)
        }

        .ok {
            color: var(--ok)
        }

        .er {
            color: var(--er)
        }

        .g td,
        .g th {
            text-align: center;
            white-space: normal;
            min-width: 96px;
            vertical-align: top;
            font-size: 12px
        }

        .g td b {
            display: block;
            font-weight: 500
        }

        .g td i {
            color: var(--mu)
        }

        .g td.hit {
            background: var(--ac2);
            cursor: pointer
        }

        .slot {
            cursor: pointer
        }

        .slot.off {
            background: var(--s);
            color: var(--mu)
        }

        .msg {
            border-left: 2px solid var(--ac);
            padding: 4px 12px;
            margin: 0 0 8px;
            font-size: 13px
        }

        .msg.bad {
            border-color: var(--er)
        }

        /* Official Institutional Sheet Styles (College / University / Intermediate Standard) */
        .official-sheet {
            background: #fff;
            color: #111827;
            border: 2px solid #222;
            padding: 18px 22px 24px;
            margin: 16px 0 24px;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            font-family: Inter, Segoe UI, Arial, sans-serif;
            overflow-x: auto
        }

        .sheet-header {
            text-align: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 10px
        }

        .sheet-college-name {
            font-size: 23px;
            font-weight: 800;
            color: #153a8a;
            letter-spacing: -.01em;
            margin: 0 0 4px;
            font-style: italic
        }

        .sheet-dept-name {
            font-size: 17.5px;
            font-weight: 700;
            color: #167338;
            margin: 0 0 3px
        }

        .sheet-sem-title {
            font-size: 14px;
            font-weight: 700;
            color: #222;
            margin: 0;
            letter-spacing: .05em
        }

        .sheet-meta-table {
            width: 100%;
            border-collapse: collapse;
            border: 1.5px solid #222;
            font-size: 13px;
            margin-bottom: 10px;
            background: #fff
        }

        .sheet-meta-table td {
            border: 1px solid #333;
            padding: 6px 12px;
            color: #111;
            font-weight: 500;
            white-space: normal
        }

        .sheet-meta-table .bld {
            font-weight: 700;
            color: #111
        }

        .sheet-meta-table .room-val {
            color: #d32f2f;
            font-weight: 800;
            font-size: 15px;
            margin-left: 6px
        }

        .sheet-grid-table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid #222;
            font-size: 12.5px;
            text-align: center;
            margin-bottom: 16px;
            background: #fff
        }

        .sheet-grid-table th,
        .sheet-grid-table td {
            border: 1px solid #333;
            padding: 8px 5px;
            vertical-align: middle;
            white-space: normal
        }

        .sheet-grid-table th.time-th {
            background: #c6efce;
            color: #0f5132;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: .02em
        }

        .sheet-grid-table th.period-th {
            background: #ffeb9c;
            color: #78350f;
            font-weight: 700;
            font-size: 12.5px
        }

        .sheet-grid-table td.day-cell {
            background: #c6efce;
            color: #0f5132;
            font-weight: 700;
            font-size: 13px;
            width: 95px;
            text-align: center
        }

        .sheet-grid-table td.lunch-col {
            background: #ffeb9c;
            color: #78350f;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: .12em;
            width: 80px;
            text-align: center;
            vertical-align: middle
        }

        .sheet-grid-table td.lab-cell {
            background: #fff3cd;
            font-weight: 700;
            color: #222;
            border: 1px solid #444
        }

        .sheet-grid-table td.theory-cell {
            background: #fff;
            font-weight: 600;
            color: #111
        }

        .sheet-ref-table {
            width: 100%;
            border-collapse: collapse;
            border: 1.5px solid #222;
            font-size: 12px;
            background: #fff;
            margin-top: 8px
        }

        .sheet-ref-table th {
            border: 1px solid #444;
            padding: 7px 10px;
            background: #e5e7eb;
            color: #111;
            font-weight: 700;
            text-align: left;
            font-size: 11.5px;
            text-transform: uppercase
        }

        .sheet-ref-table td {
            border: 1px solid #444;
            padding: 6px 10px;
            color: #111;
            white-space: normal
        }

        .sheet-ref-table td.center {
            text-align: center
        }

        .sheet-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 28px;
            padding: 12px 10px 4px;
            font-size: 12px;
            font-weight: 700;
            color: #111
        }

        .inst-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 14px
        }

        .inst-badge-btn {
            border: 1px solid var(--bd);
            background: var(--w);
            color: var(--tx);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer
        }

        .inst-badge-btn.active {
            background: var(--ac);
            color: var(--pt);
            border-color: var(--ac);
            font-weight: 600
        }

        @media print {
            body {
                background: #fff !important;
                color: #000 !important
            }

            nav,
            .inst-toolbar,
            .inst-badges,
            button,
            .row,
            h2,
            .lead,
            .cards {
                display: none !important
            }

            main {
                padding: 0 !important;
                max-width: none !important;
                margin: 0 !important;
                width: 100% !important
            }

            .app {
                display: block !important;
                box-shadow: none !important;
                max-width: none !important;
                margin: 0 !important
            }

            .official-sheet {
                box-shadow: none !important;
                border: 1.5px solid #000 !important;
                margin: 0 !important;
                padding: 8px !important
            }

            @page {
                size: landscape;
                margin: 8mm
            }
        }

        @media(max-width:760px) {
            .app {
                display: block
            }

            nav {
                width: auto;
                height: auto;
                position: static;
                border: 0;
                border-bottom: 1px solid var(--bd)
            }

            main {
                padding: 24px 16px
            }
        }
    </style>
</head>

            document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { S[key].splice(+b.dataset.del, 1); log("Removed record", k); drawT(k) })
        }
        function loginView() {
            return `<div style="display:flex;justify-content:center;align-items:center;min-height:85vh;width:100%"><div style="max-width:440px;width:100%;background:var(--w);padding:32px 28px;border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.06)"><h2>SmartTimetable</h2><p class="lead">Intelligent timetable scheduling for universities, colleges and schools. Sign in to continue.</p><p class="it" style="margin:0 0 4px">Institution type</p><select id="ins" style="width:100%">${Object.entries(INST).map(([id, i]) => `<option value="${id}"${id == S.inst ? " selected" : ""}>${i.name}</option>`).join("")}</select>
<p class="it" style="margin:12px 0 4px">Email</p><input id="em" type="email" style="width:100%" autocomplete="username"><p class="it" style="margin:12px 0 4px">Password</p><input id="pw" type="password" style="width:100%" autocomplete="current-password">
<p style="margin-top:14px"><button class="p" id="si">Sign in</button> <button id="fp">Forgot password</button></p><p id="le" class="er"></p>
<h4 style="margin-top:24px">Demo accounts</h4><div class="wrap"><table><tr><th>Role</th><th>Email</th><th>Password</th></tr>${S.acct.map((a, i) => `<tr data-fill="${i}" style="cursor:pointer"><td>${ROLE[a.role].label}${a.dept ? " · " + a.dept : ""}</td><td class="c">${a.e}</td><td class="c">${a.p}</td></tr>`).join("")}</table></div>
<p class="it" style="margin-top:8px">Verified by the backend API.</p></div></div>`}
        function bindLogin() {
            const g = id => document.getElementById(id); S.fails = S.fails || 0;
            const go = () => {
                g("le").className = "er"; const e = g("em").value.trim().toLowerCase(), p = g("pw").value; if (S.fails >= 5) { g("le").textContent = "Too many failed attempts. Reload the page to try again."; return }
                const a = S.acct.find(x => x.e == e && x.p == p); if (!a) { S.fails++; g("le").textContent = "Invalid email or password."; return }
                if (!a.on) { g("le").textContent = "This account has been disabled. Contact the administrator."; return }
                S.user = a; S.fails = 0; log("Signed in", "session"); location.hash = ROLE[a.role].home; route()
            };
            g("ins").onchange = () => { loadInst(g("ins").value); route() }; g("si").onclick = go;[g("em"), g("pw")].forEach(i => i.onkeydown = e => { if (e.key == "Enter") go() });
            g("fp").onclick = () => { g("le").className = "it"; g("le").textContent = "If this email has an account, a reset link has been sent. (Demo only.)" };
            document.querySelectorAll("[data-fill]").forEach(r => r.onclick = () => { const a = S.acct[+r.dataset.fill]; g("em").value = a.e; g("pw").value = a.p })
        }
        function route() {
            const u = S.user, nav = $("#nav");
            if (!u) { nav.style.display = "none"; $("#main").innerHTML = loginView(); bindLogin(); return }
            nav.style.display = ""; const R = ROLE[u.role]; let k = location.hash.slice(1) || R.home;
            nav.innerHTML = `<h1>SmartTimetable</h1><span class="it">${INST[S.inst].name}</span>
<div style="margin:4px 8px 12px"><select id="navInstSelect" style="width:100%;font-size:12px;padding:4px 6px">${Object.entries(INST).map(([id, i]) => `<option value="${id}"${id == S.inst ? " selected" : ""}>${i.name}</option>`).join("")}</select></div>` + GROUPS.map(([g, l]) => { const ls = l.filter(([id]) => allowed(id)); return ls.length ? `<h6>${g}</h6>` + ls.map(([id, n]) => `<a href="#${id}" class="${id == k ? "on" : ""}">${NM()[id] || n}</a>`).join("") : "" }).join("") + `<div class="nf"><div class="card" style="padding:10px 12px;margin-bottom:8px"><b style="font-size:14px">${u.name}</b><span>${R.label}${u.dept ? " · " + u.dept : ""}</span></div><button id="so" style="width:100%">Sign out</button></div>`;
            const navSel = document.getElementById("navInstSelect");
            if (navSel) { navSel.onchange = e => { const target = e.target.value; if (target && INST[target]) { loadInst(target); S.user = S.acct.find(a => a.role === u.role) || S.acct[0]; route(); } }; }
            $("#so").onclick = () => { log("Signed out", "session"); S.user = null; location.hash = ""; route() };
            if (!allowed(k)) { $("#main").innerHTML = head("Access denied", `Your role (${R.label}) is not authorised to open this page.`) + `<a href="#${R.home}" style="color:var(--ac)">Return to your home page</a>`; return }
            $("#main").innerHTML = CRUD[k] ? crud(k) : (V[k] || V.dashboard)(); bind(k); scrollTo(0, 0)
        }
        function bind(k) {
            const g = id => document.getElementById(id);
            if (CRUD[k]) {
                const key = CRUD[k][2]; drawT(k); g("q").oninput = () => drawT(k);
                if (g("add")) g("add").onclick = () => {
                    const v = [...document.querySelectorAll(".f")].map(i => i.value.trim()); if (!v[0]) return; const d = dp(); let ok = true; if (d) { if (key == "fac" || key == "sub") v[2] = d; else if (key == "bat" || key == "req") ok = v[0].startsWith(d + "-") }
                    if (!ok) { g("cm").textContent = `You can only add records for the ${d} ${INST[S.inst].unit.toLowerCase()} (batch names start with ${d}-).`; return }
                    S[key].push(v); log("Added record", k); drawT(k); document.querySelectorAll(".f").forEach(i => i.value = ""); g("cm").textContent = ""
                }
            }
            if (k == "availability") {
                const draw = () => {
                    const f = g("af").value, u = S.unav[f] || []; g("av").innerHTML = `<div class="wrap"><table class="g"><tr><th></th>${D.map(d => `<th>${d}</th>`).join("")}</tr>${P.map((t, p) => `<tr><th>${t}</th>${D.map((_, d) => { const off = u.includes(d + "-" + p); return `<td class="slot ${off ? "off" : ""}" data-s="${d}-${p}">${off ? "Unavailable" : "Available"}</td>` }).join("")}</tr>`).join("")}</table></div>`;
                    document.querySelectorAll(".slot").forEach(c => c.onclick = () => { if (!can("availability")) return; const a = S.unav[f] = S.unav[f] || [], i = a.indexOf(c.dataset.s); i < 0 ? a.push(c.dataset.s) : a.splice(i, 1); log("Updated availability", f); draw() })
                }; g("af").onchange = draw; draw()
            }
            if (k == "generate") g("go").onclick = () => { generate(false, dp()); location.hash = "results" };
            if (k == "editor" && ttS().length && g("en") && g("en").value) {
                const ix = () => +g("en").value.split(" ")[0]; g("en").onchange = () => { const e = S.tt[ix()]; g("ed").value = D[e.d]; g("ep").value = P[e.p]; g("er").value = e.r }; g("en").onchange();
                g("mv").onclick = () => { const t = JSON.parse(JSON.stringify(S.tt)), e = t[ix()]; e.d = D.indexOf(g("ed").value); e.p = P.indexOf(g("ep").value); e.r = g("er").value; e.lk = true; const m = validate(t); if (m.length) g("em").innerHTML = m.map(x => `<p class="msg bad">${x}</p>`).join(""); else { S.tt = t; g("em").innerHTML = `<p class="msg ok">Move is valid. Click Save draft to keep it.</p>`; log("Moved entry", "timetable") } };
                g("sv").onclick = () => { S.versions.push({ v: S.versions.length + 1, at: new Date().toLocaleTimeString(), n: S.tt.length, tt: JSON.parse(JSON.stringify(S.tt)), st: "draft" }); S.status = "draft"; log("Saved draft", "timetable"); route() }
            }
            if (k == "versions" && S.versions.length) {
                document.querySelectorAll("[data-rs]").forEach(b => b.onclick = () => { const v = S.versions[+b.dataset.rs]; S.tt = JSON.parse(JSON.stringify(v.tt)); S.status = "draft"; log("Restored v" + v.v, "timetable"); route() });
                if (g("sub")) g("sub").onclick = () => { const m = validate(); if (m.length || S.unassigned.length) { g("pm").innerHTML = `<span class="er">Cannot submit: resolve ${m.length} conflict(s) and ${S.unassigned.length} unassigned session(s) first.</span>`; return } S.status = "submitted"; S.notes.unshift(["Timetable submitted for approval by " + S.user.name + ".", "Just now"]); log("Submitted for approval", "timetable"); g("pm").innerHTML = `<span class="ok">Submitted for approval.</span>` };
                if (g("pub")) g("pub").onclick = () => { const m = validate(); if (m.length || S.unassigned.length) { g("pm").innerHTML = `<span class="er">Cannot publish: ${m.length} conflict(s), ${S.unassigned.length} unassigned session(s).</span>` } else { S.status = "published"; S.versions[S.versions.length - 1].st = "published"; S.notes.unshift(["A new timetable has been published.", "Just now"]); log("Published timetable", "timetable"); g("pm").innerHTML = `<span class="ok">Published.</span>` } }
            }
            if (k == "users") document.querySelectorAll("[data-tg]").forEach(b => b.onclick = () => { const a = S.acct[+b.dataset.tg]; a.on = !a.on; log((a.on ? "Enabled" : "Disabled") + " account " + a.e, "user"); route() });
            if (k == "results" && g("rg")) g("rg").onclick = () => { generate(true, dp()); route() };
            if (k == "reports") { const csv = () => "Batch,Subject,Faculty,Room,Day,Time\n" + ttS().map(e => [e.b, e.s, e.f, e.r, D[e.d], P[e.p]].join(",")).join("\n"); g("csv").onclick = () => { g("ta").style.display = "block"; g("ta").value = csv() }; g("cp").onclick = async () => { try { await navigator.clipboard.writeText(csv()); g("cp").textContent = "Copied" } catch (e) { g("csv").click() } } }
            if (["ftt", "rtt"].includes(k)) { const sel = g(k == "ftt" ? "fv" : "rv"), draw = () => { if (!S.tt.length) { g("vw").innerHTML = need(); return } if (["faculty", "student"].includes(S.user.role) && S.status != "published") { g("vw").innerHTML = `<p><em>The timetable has not been published yet.</em></p>`; return } const v = sel ? sel.value.split(" ")[0] : "", f = k == "ftt" ? "f" : "r"; const l = S.tt.filter(e => e[f] == v || (k == "ftt" && (e.fName == v || (S.fac.find(fc => fc[0] == v) && e.fName == S.fac.find(fc => fc[0] == v)[1])))); g("vw").innerHTML = grid(l, e => k == "ftt" ? e.b + " · " + e.r : (e.b + " · " + (e.fName || e.f))) + `<p class="it">${l.length} session(s) per week.</p>` }; if (sel) { sel.onchange = draw; draw() } }
            if (k == "stt") {
                let officialMode = true; const sel = g("bv"), togBtn = g("togView");
                document.querySelectorAll("[data-switch]").forEach(btn => { btn.onclick = () => { const target = btn.dataset.switch; if (target && INST[target]) { const u = S.user; loadInst(target); if (u) S.user = S.acct.find(a => a.role === u.role) || S.acct[0]; route(); } } });
                const draw = () => { if (!S.tt.length && !INST[S.inst].officialData) { g("vw").innerHTML = need(); return } if (["faculty", "student"].includes(S.user.role) && S.status != "published" && !INST[S.inst].officialData) { g("vw").innerHTML = `<p><em>The timetable has not been published yet.</em></p>`; return } const bv = sel ? sel.value.split(" ")[0] : (S.bat[0] ? S.bat[0][0] : ""); if (officialMode && INST[S.inst].officialData) { g("vw").innerHTML = renderOfficialSheet(S.inst, bv) } else { const l = S.tt.filter(e => e.b == bv); g("vw").innerHTML = grid(l, e => (e.fName || e.f) + " · " + e.r) + `<p class="it">${l.length} session(s) per week.</p>` } };
                if (togBtn) togBtn.onclick = () => { officialMode = !officialMode; togBtn.textContent = officialMode ? "Grid View" : "Official View"; togBtn.className = officialMode ? "p" : ""; draw() }; if (sel) sel.onchange = draw; draw()
            }
        }
        loadInst("engg"); addEventListener("hashchange", route); route();
    </script>
</body>

</html>
